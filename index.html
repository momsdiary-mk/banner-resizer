<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배너 자동 리사이징</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--line:#e3e6ec;--tx:#1b2230;--sub:#667085;--mute:#98a2b3;
  --pri:#2457c5;--prib:#1d47a3;
  --ok:#12805c;--okbg:#e7f5ef;--chk:#b45309;--chkbg:#fff4e0;--ed:#2457c5;--edbg:#e8effc;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;color:var(--tx);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line)}
.hin{max-width:1360px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.hin h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps span{font-size:13px;padding:5px 12px;border-radius:999px;background:#eef0f4;color:var(--sub);font-weight:600}
.steps span.on{background:var(--edbg);color:var(--ed)}
.steps span.done{background:var(--okbg);color:var(--ok)}
.priv{margin-left:auto;color:var(--mute);font-size:13px}
main{max-width:1360px;margin:0 auto;padding:24px 28px 80px}
.drop{display:block;border:2px dashed #b7c0cf;background:#fff;border-radius:16px;padding:56px 24px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--edbg)}
.drop b{display:block;font-size:20px;letter-spacing:-.3px}
.drop p{margin:10px 0 0;color:var(--sub);font-size:14px}
.loaded{display:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px;align-items:center;gap:18px;flex-wrap:wrap}
.loaded img{height:60px;border:1px solid var(--line);border-radius:6px;background:#fff}
.loaded .nm{flex:1;min-width:200px}
.loaded .nm b{display:block;font-size:15px}
.loaded .nm small{color:var(--sub);font-size:13px}
.fn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
input[type=text]{padding:8px 10px;border:1px solid #c9cfda;border-radius:8px;font:inherit;font-size:14px;width:190px}
input[type=text]:focus{outline:2px solid var(--edbg);border-color:var(--pri)}
button{padding:9px 16px;border:1px solid #c9cfda;background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--tx)}
button:hover{background:#f4f6fa}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--prib)}
button:disabled{opacity:.45;cursor:default}
#dash{display:none;margin-top:20px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;border-top:4px solid #c9cfda}
.tile .l{color:var(--sub);font-size:14px;font-weight:600}
.tile .n{font-size:36px;font-weight:700;line-height:1.15;margin-top:2px;letter-spacing:-1px}
.tile .d{color:var(--mute);font-size:13px;margin-top:2px}
.tile.ok{border-top-color:var(--ok)}.tile.ok .n{color:var(--ok)}
.tile.chk{border-top-color:var(--chk)}.tile.chk .n{color:var(--chk)}
.tile.ed{border-top-color:var(--ed)}.tile.ed .n{color:var(--ed)}
.msg{margin:16px 0 4px;padding:14px 18px;border-radius:var(--r);font-size:16px;font-weight:700;letter-spacing:-.2px}
.msg.good{background:var(--okbg);color:var(--ok)}
.msg.warn{background:var(--chkbg);color:var(--chk)}
.msg small{display:block;font-weight:500;font-size:13px;margin-top:2px;opacity:.9}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.bar .lab{font-weight:700;margin-right:2px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:7px 16px;border:1px solid #c9cfda;border-radius:999px;background:#fff;cursor:pointer;user-select:none;font-size:14px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chip input{display:none}
.sp{flex:1}
.sec{margin-top:28px}
.sec h3{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.sec h3 small{font-size:13px;color:var(--sub);font-weight:600;background:#eceef3;padding:2px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.cname{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.cspec{font-size:13px;color:var(--sub);margin-top:2px}
.badge{flex:none;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
.st-ok .badge{background:var(--okbg);color:var(--ok)}
.st-check .badge{background:var(--chkbg);color:var(--chk)}
.st-edited .badge{background:var(--edbg);color:var(--ed)}
.cv{background:#eef0f4;border-radius:8px;height:250px;display:flex;align-items:center;justify-content:center;padding:12px}
.cv canvas{max-width:100%;max-height:226px;width:auto;height:auto;display:block;background:#fff;outline:1px solid #d5d9e0;box-shadow:0 2px 6px rgba(16,24,40,.12)}
.kb{margin-top:14px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
.kb b{color:var(--tx);font-size:14px}
.kbbar{height:6px;background:#e9ecf1;border-radius:3px;margin-top:5px}
.kbbar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.kbbar i.over{background:#c0392b}
.verdict{margin-top:14px;border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.55;flex:1}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.check{background:var(--chkbg);color:#8a4208}
.verdict.edited{background:var(--edbg);color:var(--ed)}
.verdict div+div{margin-top:4px}
.verdict .nt{color:var(--sub);font-size:12.5px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1}
#modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:10;align-items:center;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:16px;max-width:1040px;width:100%;max-height:94vh;overflow:auto;padding:24px;display:flex;gap:28px;flex-wrap:wrap}
#modal .pv{flex:1 1 440px;min-width:300px}
#modal .pv h3{margin:0 0 12px;font-size:17px}
#modal .pv .cv{height:auto;min-height:280px;padding:16px}
#modal .pv canvas{max-width:100%;max-height:56vh;cursor:grab;touch-action:none}
#modal .ctl{flex:0 0 290px}
#modal .ctl h3{margin:0 0 4px;font-size:17px}
#modal .ctl label{display:block;margin:16px 0 6px;font-size:13px;color:var(--sub);font-weight:600}
#modal .ctl input[type=range]{width:100%}
#modal select{width:100%;padding:9px;border:1px solid #c9cfda;border-radius:8px;font:inherit;font-size:14px}
.hint{font-size:13px;color:var(--sub);margin-top:10px;text-align:center}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}.hin,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header><div class="hin">
  <h1>배너 자동 리사이징</h1>
  <div class="steps" id="steps">
    <span id="s1" class="on">1. 큰 배너 올리기</span><span id="s2">2. 자동 변환 결과 확인</span><span id="s3">3. 이상하면 수정</span><span id="s4">4. 내려받기</span>
  </div>
  <div class="priv">이미지는 이 PC 안에서만 처리됩니다</div>
</div></header>
<main>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" hidden>
    <b>큰 배너 이미지를 끌어다 놓거나 클릭해서 선택하세요</b>
    <p>권장: 가로 1800 x 세로 900 (2:1) · PNG 또는 JPG<br>올리는 즉시 3개 브랜드 12개 규격이 자동으로 만들어집니다.</p>
  </label>
  <div class="loaded" id="loaded">
    <img id="thumb" alt="">
    <div class="nm"><b id="fname"></b><small id="finfo"></small></div>
    <label class="fn">저장 파일명(영문) <input type="text" id="svc"></label>
    <button id="replace">다른 이미지로 교체</button>
  </div>

  <div id="dash">
    <div class="tiles">
      <div class="tile"><div class="l">전체 규격</div><div class="n" id="tAll">0</div><div class="d">선택한 브랜드 기준</div></div>
      <div class="tile ok"><div class="l">정상</div><div class="n" id="tOk">0</div><div class="d">바로 사용 가능</div></div>
      <div class="tile chk"><div class="l">확인 필요</div><div class="n" id="tChk">0</div><div class="d">수정을 권장</div></div>
      <div class="tile ed"><div class="l">수정 완료</div><div class="n" id="tEd">0</div><div class="d">직접 조정한 규격</div></div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="bar">
      <span class="lab">만들 브랜드</span>
      <label class="chip on" data-b="mom"><input type="checkbox" checked>맘스다이어리</label>
      <label class="chip on" data-b="momple"><input type="checkbox" checked>맘플</label>
      <label class="chip on" data-b="moa"><input type="checkbox" checked>모아베베</label>
      <label class="chip" id="onlyChk"><input type="checkbox">확인 필요만 보기</label>
      <span class="sp"></span>
      <button id="zipOk">정상만 ZIP 받기</button>
      <button id="zipAll" class="pri">전체 ZIP 받기</button>
    </div>
    <div id="grid"></div>
  </div>
</main>

<div id="modal">
  <div class="box">
    <div class="pv">
      <h3 id="mTitle"></h3>
      <div class="cv"><canvas id="mcv"></canvas></div>
      <div class="hint">이미지를 마우스로 끌어서 위치를 옮길 수 있습니다.</div>
      <div id="mWhy" class="verdict ok"></div>
    </div>
    <div class="ctl">
      <h3>수정</h3>
      <div id="layBox">
        <label>배치 방식 (가로로 긴 규격)</label>
        <select id="mlay">
          <option value="row">한 줄 배치 (글자·제품을 나란히, 양쪽 여백 최소)</option>
          <option value="fit">원본 그대로 줄이기</option>
        </select>
      </div>
      <div id="fitBox">
        <label>확대 <span id="zv">100</span>%</label>
        <input type="range" id="zoom" min="100" max="300" value="100">
        <label>맞추는 방식</label>
        <select id="mfit">
          <option value="cover">꽉 채우기 (넘치는 부분은 잘림)</option>
          <option value="contain">전체 보이기 (남는 곳은 배경색)</option>
        </select>
      </div>
      <label>배경색 (여백·좌우 단색 영역)</label>
      <div style="display:flex;gap:8px"><input type="color" id="mbg" style="flex:1;height:38px;border:1px solid #c9cfda;border-radius:8px;padding:2px"><button id="mbgAuto">원본에서 자동</button></div>
      <div style="display:flex;gap:8px;margin-top:28px">
        <button id="mReset">처음 상태로</button><span class="sp"></span>
        <button id="mCancel">취소</button><button id="mOk" class="pri">적용</button>
      </div>
    </div>
  </div>
</div>

<script>
const BRANDS={mom:'맘스다이어리',momple:'맘플',moa:'모아베베'};
// mx: 좌우 단색 여백(px)
const SPECS=[
 {b:'mom',name:'모바일 메인',w:640,h:240,f:'png',kb:200,mx:20},
 {b:'mom',name:'모바일 버블',w:600,h:100,f:'png',kb:200,mx:20},
 {b:'mom',name:'모바일 서브 상단',w:640,h:100,f:'png',kb:100,mx:20},
 {b:'mom',name:'서브 중단B / 임신육아 PUSH',w:640,h:200,f:'png',kb:200,mx:20},
 {b:'mom',name:'일기쓰기 서브 팝업',w:600,h:680,f:'png',kb:500,mx:0},
 {b:'mom',name:'모바일 앱 PUSH',w:900,h:450,f:'png',kb:500,mx:50},
 {b:'momple',name:'체험단 썸네일',w:600,h:280,f:'jpg',kb:0,mx:0},
 {b:'moa',name:'초기면 팝업 / 앱종료 전면',w:720,h:960,f:'png',kb:300,mx:0},
 {b:'moa',name:'영상 리스트 / 이벤트 배너',w:720,h:370,f:'png',kb:300,mx:0},
 {b:'moa',name:'영상 종료 배너',w:720,h:700,f:'png',kb:300,mx:0},
 {b:'moa',name:'알림 푸시',w:614,h:343,f:'png',kb:300,mx:0},
 {b:'moa',name:'하단 띠 / 성장정보 띠',w:720,h:119,f:'png',kb:300,mx:0},
];
const $=id=>document.getElementById(id);
let IM=null,AUTO=null;
const S={},R={};
const on={mom:true,momple:true,moa:true};
let onlyCheck=false;

// ---------- 원본 분석: 내용이 있는 영역과 배경색 찾기 ----------
function analyze(im){
  const sc=Math.min(1,160/Math.max(im.width,im.height));
  const w=Math.max(8,Math.round(im.width*sc)),h=Math.max(8,Math.round(im.height*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  const ring=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(x<2||y<2||x>=w-2||y>=h-2){const i=(y*w+x)*4;ring.push([d[i],d[i+1],d[i+2]]);}}
  const med=k=>{const a=ring.map(p=>p[k]).sort((p,q)=>p-q);return a[a.length>>1];};
  const bg=[med(0),med(1),med(2)];
  const uniform=ring.filter(p=>Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2])<=30).length/ring.length>=0.95;
  const colN=new Array(w).fill(0),rowN=new Array(h).fill(0),mask=new Uint8Array(w*h);let cnt=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
    if(Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])>60){colN[x]++;rowN[y]++;cnt++;mask[y*w+x]=1;}}
  let bbox=[0,0,1,1],blocks=[];
  if(cnt>w*h*0.01&&cnt<w*h*0.97){
    const tc=Math.max(1,h*0.01),tr=Math.max(1,w*0.01);
    let x0=colN.findIndex(v=>v>=tc),x1=w-1-[...colN].reverse().findIndex(v=>v>=tc);
    let y0=rowN.findIndex(v=>v>=tr),y1=h-1-[...rowN].reverse().findIndex(v=>v>=tr);
    if(x0>=0&&y0>=0&&x1>x0&&y1>y0)bbox=[x0/w,y0/h,(x1+1)/w,(y1+1)/h];
    // 좌우로 떨어진 덩어리(글자, 제품 등)를 나눔
    const thr=Math.max(1,h*0.005),minGap=Math.max(3,Math.round(w*0.025));
    const segs=[];let st=-1,last=-1;
    for(let x=0;x<w;x++){
      if(colN[x]>=thr){ if(st<0)st=x; else if(x-last>minGap){segs.push([st,last]);st=x;} last=x; }
    }
    if(st>=0)segs.push([st,last]);
    for(const [a,b] of segs){
      let ya=-1,yb=-1;
      for(let y=0;y<h;y++){let any=false;for(let x=a;x<=b;x++){if(mask[y*w+x]){any=true;break;}}if(any){if(ya<0)ya=y;yb=y;}}
      if(ya<0||(b-a+1)*(yb-ya+1)<0.002*w*h)continue;
      blocks.push([a/w,ya/h,(b+1)/w,(yb+1)/h]);
    }
  }
  const hex='#'+bg.map(v=>v.toString(16).padStart(2,'0')).join('');
  return {bbox,blocks,uniform,bg:hex,cx:(bbox[0]+bbox[2])/2,cy:(bbox[1]+bbox[3])/2};
}

// ---------- 배치 계산·그리기 ----------
function place(spec,s){
  const mx=spec.mx||0,aw=spec.w-2*mx,ah=spec.h,iw=IM.width,ih=IM.height;
  const base=s.fit==='cover'?Math.max(aw/iw,ah/ih):Math.min(aw/iw,ah/ih);
  const sc=base*s.zoom,dw=iw*sc,dh=ih*sc;
  let ox=mx+aw/2-s.cx*dw,oy=ah/2-s.cy*dh;
  ox=dw>=aw?Math.min(mx,Math.max(mx+aw-dw,ox)):mx+(aw-dw)/2;
  oy=dh>=ah?Math.min(0,Math.max(ah-dh,oy)):(ah-dh)/2;
  return {ox,oy,dw,dh,mx,aw,ah};
}
// ---------- 가로로 긴 규격: 글자·제품을 한 줄로 나란히 배치 ----------
const ROW_MAX_HEIGHT=120;                   // 세로가 이 값 이하인 규격만 한 줄 배치 대상 (100px 규격 + 720x119)
function wideSpec(spec){return spec.h<=ROW_MAX_HEIGHT;}
function rowEligible(spec){return wideSpec(spec)&&AUTO.uniform&&AUTO.blocks.length>=2;}
function rowLayout(spec){
  const W=spec.w,H=spec.h,mx=spec.mx||0;
  const sidePad=Math.max(8,Math.round(W*0.02)),vpad=Math.max(6,Math.round(H*0.08));
  const A=W-2*mx-2*sidePad,Hh=H-2*vpad,g=Math.max(8,Math.round(W*0.02));
  const iw=IM.width,ih=IM.height,px=Math.round(iw*0.006),py=Math.round(ih*0.006);
  const bl=AUTO.blocks.map(b=>{
    const sx=Math.max(0,Math.round(b[0]*iw)-px),sy=Math.max(0,Math.round(b[1]*ih)-py);
    const ex=Math.min(iw,Math.round(b[2]*iw)+px),ey=Math.min(ih,Math.round(b[3]*ih)+py);
    return {sx,sy,sw:ex-sx,sh:ey-sy};
  });
  let pi=0;bl.forEach((b,i)=>{if(b.sh>bl[pi].sh)pi=i;});         // 가장 키가 큰 덩어리 = 제품
  const n=bl.length,P=bl[pi];
  let sp=Hh/P.sh;if(P.sw*sp>A*0.4)sp=A*0.4/P.sw;                   // 제품은 높이에 맞추되 폭의 40% 이내
  const texts=bl.filter((b,i)=>i!==pi);
  const tw=texts.reduce((a,b)=>a+b.sw,0),thmax=Math.max(...texts.map(b=>b.sh));
  const st=Math.max(0.01,Math.min((A-P.sw*sp-g*(n-1))/tw,Hh/thmax)); // 글자는 남은 폭을 최대한 사용
  bl.forEach((b,i)=>{b.k=i===pi?sp:st;b.dw=b.sw*b.k;b.dh=b.sh*b.k;b.prod=i===pi;});
  const total=bl.reduce((a,b)=>a+b.dw,0);
  const gapE=n>1?Math.min(Math.max(g,(A-total)/(n-1)),A*0.12):0;
  const rowW=total+gapE*(n-1);
  let x=mx+sidePad+(A-rowW)/2;
  for(const b of bl){b.dx=x;b.dy=(H-b.dh)/2;x+=b.dw+gapE;}
  const textH=Math.max(...bl.filter(b=>!b.prod).map(b=>b.dh));
  return {bl,textH,side:Math.round(mx+sidePad+(A-rowW)/2)};
}
function paintRow(c,spec,s){
  const g=c.getContext('2d');
  g.imageSmoothingQuality='high';
  const L=rowLayout(spec);
  for(const b of L.bl)g.drawImage(IM,b.sx,b.sy,b.sw,b.sh,b.dx,b.dy,b.dw,b.dh);
  return {row:true,L};
}
function paint(c,spec,s){
  c.width=spec.w;c.height=spec.h;
  const g=c.getContext('2d');
  g.fillStyle=s.bg;g.fillRect(0,0,spec.w,spec.h);
  if(s.layout==='row')return paintRow(c,spec,s);
  const p=place(spec,s);
  g.save();g.beginPath();g.rect(p.mx,0,p.aw,p.ah);g.clip();
  g.imageSmoothingQuality='high';g.drawImage(IM,p.ox,p.oy,p.dw,p.dh);g.restore();
  return p;
}
function check(spec,s,p){
  const out=[];
  if(s.layout==='row'){
    const L=p.L;
    if(L.textH<24)out.push(`글자 영역이 ${Math.round(L.textH)}px로 작아 읽기 어려울 수 있어요.`);
    return {issues:out,vis:1,empty:0};
  }
  const [bx0,by0,bx1,by1]=AUTO.bbox;
  const wx0=(p.mx-p.ox)/p.dw,wx1=(p.mx+p.aw-p.ox)/p.dw,wy0=-p.oy/p.dh,wy1=(p.ah-p.oy)/p.dh;
  const ix=Math.max(0,Math.min(bx1,wx1)-Math.max(bx0,wx0)),iy=Math.max(0,Math.min(by1,wy1)-Math.max(by0,wy0));
  const vis=(ix*iy)/((bx1-bx0)*(by1-by0));
  if(vis<0.97)out.push(`내용의 ${Math.round(vis*100)}%만 보입니다. 글자나 제품이 잘렸을 수 있어요.`);
  const empty=1-Math.min(1,(p.dw*p.dh)/(p.aw*p.ah));
  if(s.fit==='contain'&&empty>0.6)out.push(`잘리지 않게 맞췄지만 빈 여백이 ${Math.round(empty*100)}%입니다. 확대하거나 별도 배치가 필요할 수 있어요.`);
  return {issues:out,vis,empty};
}

// ---------- 저장 파일 만들기 (용량 맞춤 포함) ----------
const blobOf=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
async function encode(spec,c){
  const lim=spec.kb*1024,notes=[];
  if(spec.f==='jpg'){
    let b=null;
    for(let q=0.92;q>=0.5;q-=0.07){b=await blobOf(c,'image/jpeg',q);if(!lim||b.size<=lim)break;}
    return {blob:b,notes};
  }
  let b=await blobOf(c,'image/png');
  if(lim&&b.size>lim){
    const g=c.getContext('2d'),src=g.getImageData(0,0,c.width,c.height);
    const t=document.createElement('canvas');t.width=c.width;t.height=c.height;const tg=t.getContext('2d');
    for(const q of [4,8,12,16,24,32,48]){
      const a=new Uint8ClampedArray(src.data);
      for(let i=0;i<a.length;i+=4){a[i]=Math.round(a[i]/q)*q;a[i+1]=Math.round(a[i+1]/q)*q;a[i+2]=Math.round(a[i+2]/q)*q;}
      tg.putImageData(new ImageData(a,c.width,c.height),0,0);
      const nb=await blobOf(t,'image/png');
      b=nb;
      if(nb.size<=lim){notes.push('용량을 맞추기 위해 색상을 단순화했습니다.');break;}
    }
  }
  return {blob:b,notes};
}

// ---------- 규격별 처리 ----------
function initState(i){
  const spec=SPECS[i];
  const s={fit:'cover',zoom:1,cx:AUTO.cx,cy:AUTO.cy,bg:AUTO.bg,edited:false,layout:rowEligible(spec)?'row':'fit'};
  // 꽉 채우면 내용이 잘리는 규격은 처음부터 "전체 보이기"로 시작 (잘림 방지)
  if(s.layout==='fit'&&check(spec,s,place(spec,s)).vis<0.97)s.fit='contain';
  S[i]=s;
}
async function process(i){
  const spec=SPECS[i],s=S[i];
  const c=document.createElement('canvas');
  const p=paint(c,spec,s);
  const ck=check(spec,s,p);
  const {blob,notes}=await encode(spec,c);
  const kb=blob.size/1024,issues=[...ck.issues];
  if(spec.kb&&kb>spec.kb)issues.push(`용량 초과: ${kb.toFixed(0)}KB (제한 ${spec.kb}KB 미만)`);
  if(s.layout==='row')notes.unshift('가로 한 줄 배치: 글자와 제품을 나란히 놓고 양쪽 여백을 최소로 했습니다.');
  else if(wideSpec(spec)&&!s.edited){
    if(!AUTO.uniform)notes.unshift('배경이 단색이 아니어서 한 줄 배치를 쓰지 못했습니다.');
    else if(AUTO.blocks.length<2)notes.unshift('글자와 제품이 붙어 있어 한 줄 배치를 쓰지 못했습니다.');
  }
  if(s.layout==='fit'&&s.fit==='contain'&&!s.edited&&ck.empty>0.02)notes.unshift('내용이 잘리지 않도록 전체가 보이게 맞췄습니다. 남는 곳은 배경색입니다.');
  R[i]={canvas:c,blob,kb,issues,notes,status:issues.length?'check':(s.edited?'edited':'ok')};
}
const badgeText={ok:'정상',check:'확인 필요',edited:'수정 완료'};
function verdictHTML(r){
  const lines=r.issues.length?r.issues.map(t=>`<div>• ${t}</div>`).join(''):`<div>${r.status==='edited'?'✔ 수정한 내용이 반영되었습니다.':'✔ 내용이 모두 보이고 규격에 맞습니다.'}</div>`;
  return lines+r.notes.map(t=>`<div class="nt">${t}</div>`).join('');
}
function cardHTML(i){
  const spec=SPECS[i],r=R[i];
  const pct=spec.kb?Math.min(100,r.kb/spec.kb*100):0;
  return `<div class="chead"><div><div class="cname">${spec.name}</div><div class="cspec">${spec.w} x ${spec.h}px · ${spec.f.toUpperCase()}</div></div><span class="badge">${badgeText[r.status]}</span></div>
  <div class="cv"></div>
  <div class="kb"><span>파일 용량 <b>${r.kb.toFixed(0)}KB</b></span><span>${spec.kb?`제한 ${spec.kb}KB 미만`:'용량 제한 없음'}</span></div>
  ${spec.kb?`<div class="kbbar"><i class="${r.kb>spec.kb?'over':''}" style="width:${pct}%"></i></div>`:''}
  <div class="verdict ${r.status}">${verdictHTML(r)}</div>
  <div class="btns"><button data-edit="${i}">수정</button><button data-save="${i}">저장</button></div>`;
}
function fillCard(i){
  const el=$('card'+i);if(!el)return;
  el.className='card st-'+R[i].status;
  el.innerHTML=cardHTML(i);
  el.querySelector('.cv').appendChild(R[i].canvas);
}
function fname(i){const s=SPECS[i];return `${($('svc').value.trim()||'company')}_${s.w}x${s.h}.${s.f==='jpg'?'jpg':'png'}`;}

// ---------- 화면 ----------
function buildGrid(){
  let h='';
  for(const k in BRANDS){
    const ids=SPECS.map((s,i)=>s.b===k?i:-1).filter(i=>i>=0);
    h+=`<div class="sec" data-sec="${k}"><h3>${BRANDS[k]} <small>${ids.length}종</small></h3><div class="grid">`+
       ids.map(i=>`<div class="card" id="card${i}" data-b="${k}"></div>`).join('')+`</div></div>`;
  }
  $('grid').innerHTML=h;
  SPECS.forEach((s,i)=>fillCard(i));
  applyView();
}
function applyView(){
  let all=0,ok=0,chk=0,ed=0;
  SPECS.forEach((s,i)=>{
    const el=$('card'+i);if(!el||!R[i])return;
    const show=on[s.b]&&(!onlyCheck||R[i].status==='check');
    el.style.display=show?'':'none';
    if(on[s.b]){all++;if(R[i].status==='ok')ok++;else if(R[i].status==='check')chk++;else ed++;}
  });
  document.querySelectorAll('.sec').forEach(sec=>{
    sec.style.display=[...sec.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'':'none';
  });
  $('tAll').textContent=all;$('tOk').textContent=ok;$('tChk').textContent=chk;$('tEd').textContent=ed;
  const m=$('msg');
  if(!all){m.className='msg warn';m.innerHTML='만들 브랜드를 선택해 주세요.';}
  else if(!chk){m.className='msg good';m.innerHTML=`모든 규격(${all}개)이 정상입니다.<small>바로 내려받으셔도 됩니다.</small>`;}
  else{m.className='msg warn';m.innerHTML=`${all}개 중 ${chk}개는 확인이 필요합니다.<small>주황색 카드의 [수정]을 눌러 위치와 크기를 조정해 주세요.</small>`;}
  $('zipOk').disabled=!ok&&!ed;$('zipAll').disabled=!all;
}
async function convertAll(){
  for(let i=0;i<SPECS.length;i++){initState(i);await process(i);}
  buildGrid();
}
async function loadFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=async()=>{
    IM=im;AUTO=analyze(im);
    $('drop').style.display='none';$('loaded').style.display='flex';$('dash').style.display='block';
    $('thumb').src=r.result;$('fname').textContent=f.name;
    $('finfo').textContent=`${im.width} x ${im.height}px`+(im.width<900?' · 원본이 작아 확대되는 규격은 화질이 떨어질 수 있습니다.':'');
    if(!$('svc').value)$('svc').value=f.name.replace(/\.[^.]+$/,'').replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'company';
    $('s1').className='done';$('s2').className='on';$('s3').className='on';$('s4').className='on';
    await convertAll();
  };im.src=r.result;};
  r.readAsDataURL(f);
}
$('file').onchange=e=>loadFile(e.target.files[0]);
$('replace').onclick=()=>{$('file').value='';$('file').click();};
const drop=$('drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadFile(f);});
document.querySelectorAll('.chip[data-b]').forEach(ch=>{
  ch.querySelector('input').onchange=e=>{on[ch.dataset.b]=e.target.checked;ch.classList.toggle('on',e.target.checked);applyView();};
});
$('onlyChk').querySelector('input').onchange=e=>{onlyCheck=e.target.checked;$('onlyChk').classList.toggle('on',onlyCheck);applyView();};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
$('grid').addEventListener('click',e=>{
  const ed=e.target.dataset.edit,sv=e.target.dataset.save;
  if(ed!==undefined)openEditor(+ed);
  if(sv!==undefined)download(R[+sv].blob,fname(+sv));
});

// ---------- 수정 창 ----------
let E=null;
function openEditor(i){
  E={i,s:{...S[i]}};
  const spec=SPECS[i];
  $('mTitle').textContent=`${BRANDS[spec.b]} · ${spec.name} (${spec.w}x${spec.h})`;
  $('zoom').value=Math.round(E.s.zoom*100);$('zv').textContent=$('zoom').value;
  $('mfit').value=E.s.fit;$('mbg').value=E.s.bg;
  $('layBox').style.display=rowEligible(spec)?'':'none';
  $('mlay').value=E.s.layout;syncCtl();
  $('modal').style.display='flex';repaintE();
}
function syncCtl(){$('fitBox').style.display=E.s.layout==='row'?'none':'';$('mcv').style.cursor=E.s.layout==='row'?'default':'grab';}
function repaintE(){
  const spec=SPECS[E.i],p=paint($('mcv'),spec,E.s),ck=check(spec,E.s,p);
  const w=$('mWhy');
  w.className='verdict '+(ck.issues.length?'check':'ok');
  w.innerHTML=ck.issues.length?ck.issues.map(t=>`<div>• ${t}</div>`).join(''):'<div>✔ 내용이 모두 보입니다.</div>';
  E.p=p;
}
$('zoom').oninput=e=>{E.s.zoom=e.target.value/100;$('zv').textContent=e.target.value;repaintE();};
$('mfit').onchange=e=>{E.s.fit=e.target.value;repaintE();};
$('mlay').onchange=e=>{E.s.layout=e.target.value;syncCtl();repaintE();};
$('mbg').oninput=e=>{E.s.bg=e.target.value;repaintE();};
$('mbgAuto').onclick=()=>{E.s.bg=AUTO.bg;$('mbg').value=AUTO.bg;repaintE();};
$('mReset').onclick=()=>{const i=E.i;initState(i);E.s={...S[i]};$('zoom').value=100;$('zv').textContent=100;$('mfit').value=E.s.fit;$('mbg').value=E.s.bg;$('mlay').value=E.s.layout;syncCtl();repaintE();};
$('mCancel').onclick=()=>{$('modal').style.display='none';E=null;};
$('mOk').onclick=async()=>{
  const i=E.i;S[i]={...E.s,edited:true};
  $('modal').style.display='none';E=null;
  await process(i);fillCard(i);applyView();
};
(function(){
  const cv=$('mcv');let drag=null;
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';};
  cv.onpointermove=e=>{
    if(!drag||!E||E.s.layout==='row')return;
    const k=cv.clientWidth/cv.width,dx=(e.clientX-drag.x)/k,dy=(e.clientY-drag.y)/k;
    drag={x:e.clientX,y:e.clientY};
    E.s.cx=Math.min(1,Math.max(0,E.s.cx-dx/E.p.dw));
    E.s.cy=Math.min(1,Math.max(0,E.s.cy-dy/E.p.dh));
    repaintE();
  };
  cv.onpointerup=()=>{drag=null;cv.style.cursor='grab';};
})();

// ---------- ZIP (압축 없이 묶기) ----------
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){
  const enc=new TextEncoder(),chunks=[],cd=[];let off=0;
  for(const f of files){
    const nb=enc.encode(f.name),crc=crc32(f.data),n=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(12,33,true);lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nb.length,true);
    chunks.push(new Uint8Array(lh.buffer),nb,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(14,33,true);ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+n;
  }
  let cs=0;cd.forEach(x=>cs+=x.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...chunks,...cd,new Uint8Array(end.buffer)],{type:'application/zip'});
}
async function zipOf(filter,label){
  const files=[];
  for(let i=0;i<SPECS.length;i++){
    if(!on[SPECS[i].b]||!R[i]||!filter(R[i]))continue;
    files.push({name:`${BRANDS[SPECS[i].b]}/${fname(i)}`,data:new Uint8Array(await R[i].blob.arrayBuffer())});
  }
  if(!files.length){alert('내려받을 파일이 없습니다.');return;}
  download(makeZip(files),`${$('svc').value.trim()||'company'}_${label}.zip`);
}
$('zipAll').onclick=()=>zipOf(()=>true,'전체');
$('zipOk').onclick=()=>zipOf(r=>r.status!=='check','정상만');
</script>
